<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="144x144"
      href="apple-touch-icon-144.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="114x114"
      href="apple-touch-icon-114.png"
    />
    <link rel="apple-touch-icon" sizes="72x72" href="apple-touch-icon-72.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon-57.png" />
    <title>iDAI.gazetteer</title>
  </head>
  <body>
    <script type="text/javascript">
      var _paq = _paq || [];
      _paq.push(["setDomains", ["*.gazetteer.dainst.org"]]);
      _paq.push(["enableLinkTracking"]);
      (function () {
        const u = "//piwik.dainst.org/";
        _paq.push(["setTrackerUrl", u + "piwik.php"]);
        _paq.push(["setSiteId", 8]);
        const g = document.createElement("script"),
          s = document.getElementsByTagName("script")[0];
        g.type = "text/javascript";
        g.async = true;
        g.defer = true;
        g.src = u + "piwik.js";
        s.parentNode.insertBefore(g, s);
      })();
    </script>
    <noscript>
      <p>
        <img
          src="//piwik.dainst.org/piwik.php?idsite=8"
          style="border: 0"
          alt=""
        />
      </p>
    </noscript>
    <gz-root></gz-root>
  </body>
</html>
